    <div class="sidebar">
      <h2>IoT Dashboard</h2>

        <li>

            <span>Transactions</span>
          </a>
        </li>

        <li class="active">
          <a href="storage.html">
            <i class="fas fa-coins"></i>
            <span>Coin Inventory</span>
          </a>
        </li>

        <li>
          <a href="settings.html">
            <i class="fas fa-gear"></i>
            <span>Settings</span>
          </a>
        </li>

        <li id="logout-btn">
          <a href="#">
            <i class="fas fa-right-from-bracket"></i>
            <span>Logout</span>
          </a>
        </li>
      </ul>
    </div>

    <div class="main">
      <div class="topbar">
        <div>
          <h1>Coin Inventory</h1>
        </div>

        <div class="topbar-actions">
          <div class="status">
            <span class="dot"></span>
            System Online
          </div>
        </div>
      </div>

      <div class="refill-section">
        <div class="refill-header">
          <div>
            <h3>Coin Refill Management</h3>
            <p>Update coin inventory manually when the machine is refilled.</p>
          </div>

          <button id="openRefillModal" class="refill-main-btn">
            + Refill Coins
          </button>
        </div>

        <div class="refill-cards"></div>
      </div>

      <!-- MODAL -->
      <div class="modal" id="refillModal">
        <div class="modal-content">
          <h2>Refill Coins</h2>

          <div class="coin-inputs">
            <label>₱1 Coin</label>
            <input
              type="number"
              id="coin1"
              placeholder="Enter quantity"
              min="1"
            />

            <label>₱5 Coin</label>
            <input
              type="number"
              id="coin5"
              placeholder="Enter quantity"
              min="1"
            />

            <label>₱10 Coin</label>
            <input
              type="number"
              id="coin10"
              placeholder="Enter quantity"
              min="1"
            />

            <label>₱20 Coin</label>
            <input
              type="number"
              id="coin20"
              placeholder="Enter quantity"
              min="1"
            />
          </div>

          <div class="modal-actions">
            <button class="cancel-btn" id="closeModal">Cancel</button>
            <button class="save-btn" id="saveRefill">Save Refill</button>
          </div>
        </div>
      </div>
      <div class="modal" id="adjustModal">
        <div class="modal-content">
          <h2 id="adjustTitle">Adjust Coin Stock</h2>

          <div class="coin-inputs">
            <label id="adjustLabel">Quantity</label>

            <input
              type="number"
              id="adjustInput"
              placeholder="Enter new quantity"
            />
          </div>

          <div class="modal-actions">
            <button class="cancel-btn" id="closeAdjustModal">Cancel</button>

            <button class="save-btn" id="saveAdjust">Save Adjustment</button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="../js/pages/storage.js"></script>
    <script type="module" src="../js/pages/logout.js"></script>
  </body>
